<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#172b29">
  <title>Tic Tac Toe — A little friendly competition</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <main>
    <header><a class="brand" href="./" aria-label="Tic Tac Toe home"><span class="logo">×<span>○</span></span> PLAYROOM</a><span class="badge"><i></i> LOCAL MULTIPLAYER</span></header>
    <section class="game" aria-labelledby="title">
      <p class="eyebrow">A CLASSIC, FOR TWO</p>
      <h1 id="title">Your move.<br><span>Make it count.</span></h1>
      <p class="intro">Two players. Nine squares. A little friendly competition.</p>
      <div class="scoreboard" aria-label="Scoreboard">
        <div class="score active" id="player-x"><span class="player"><b class="x">×</b> PLAYER X</span><strong id="score-x">0</strong></div>
        <div class="score draws"><span class="player">DRAWS</span><strong id="score-draw">0</strong></div>
        <div class="score" id="player-o"><span class="player"><b class="o">○</b> PLAYER O</span><strong id="score-o">0</strong></div>
      </div>
      <div class="play-area">
        <div class="status" role="status" aria-live="polite" id="status">Player X’s turn</div>
        <div class="board" aria-label="Tic Tac Toe board">
          <button class="cell" aria-label="Row 1, column 1, empty"></button><button class="cell" aria-label="Row 1, column 2, empty"></button><button class="cell" aria-label="Row 1, column 3, empty"></button>
          <button class="cell" aria-label="Row 2, column 1, empty"></button><button class="cell" aria-label="Row 2, column 2, empty"></button><button class="cell" aria-label="Row 2, column 3, empty"></button>
          <button class="cell" aria-label="Row 3, column 1, empty"></button><button class="cell" aria-label="Row 3, column 2, empty"></button><button class="cell" aria-label="Row 3, column 3, empty"></button>
        </div>
        <button class="new-round" id="new-round"><span aria-hidden="true">↻</span> New round</button>
      </div>
      <button class="reset" id="reset">Reset scores</button>
      <p class="hint">Three in a row. Across, down, or diagonally.</p>
    </section>
    <footer><span>LESS SCROLLING, MORE PLAYING.</span><span>Made for a moment together <span class="heart">♡</span></span></footer>
  </main>
</body>
</html>
